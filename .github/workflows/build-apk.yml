name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets are exposed to steps as env vars. This lets the `if:` guards
    # below detect whether signing secrets were configured, which the
    # `secrets` context cannot do directly inside a conditional.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build web assets
      # Regenerates the embedded-asset module, then builds www/ from
      # index.html + src/ + public/assets/ + public/vendor/. Also verifies every
      # manifest entry exists, so a 404 that would freeze the game on its
      # loading screen fails here instead of on a device.
      run: npm run build

    - name: Test asset loader
      # Proves the loader cannot hang on a stalled or missing request.
      run: npm test

    - name: Setup Capacitor
      run: npx cap sync

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        # Accept licenses
        yes | sdkmanager --licenses || true
        # Install required packages
        sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

    - name: Download gradle-wrapper.jar
      run: |
        mkdir -p android/gradle/wrapper
        curl -L -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    # ==========================================
    # SIGNING SETUP
    # ==========================================
    # Android identifies an app by its signing key. An APK signed with the
    # auto-generated debug key cannot be replaced by a later build, which
    # forces players to uninstall -- losing their save.
    #
    # Add these repository secrets (Settings > Secrets and variables > Actions):
    #   KEYSTORE_BASE64    base64 of keystore.jks  (see README)
    #   KEYSTORE_PASSWORD
    #   KEY_ALIAS
    #   KEY_PASSWORD
    # ==========================================
    - name: Decode signing keystore
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
        echo "::notice::Signing keystore loaded - release APK will be upgradeable"

    - name: Write keystore.properties
      if: env.KEYSTORE_BASE64 != ''
      run: |
        {
          echo "storeFile=keystore.jks"
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > android/keystore.properties

    # ==========================================
    # BUILDS
    # ==========================================
    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: realms-of-aetheria-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon --stacktrace

    # A signed build produces app-release.apk. An unsigned one falls back to
    # app-release-unsigned.apk, which cannot be installed as an update.
    - name: Verify APK signature
      if: env.KEYSTORE_BASE64 != ''
      run: |
        APK=android/app/build/outputs/apk/release/app-release.apk
        if [ -f "$APK" ]; then
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK"
        else
          echo "::error::Expected signed APK missing at $APK"
          exit 1
        fi

    - name: Upload Release APK
      if: env.KEYSTORE_BASE64 != ''
      uses: actions/upload-artifact@v4
      with:
        name: realms-of-aetheria-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Warn that release APK is unsigned
      if: env.KEYSTORE_BASE64 == ''
      run: |
        echo "::warning::No signing secrets configured. The release APK is "\
        "UNSIGNED and cannot be installed over a previous build. See README "\
        "for the one-time keystore setup."

    - name: Upload unsigned Release APK
      if: always() && env.KEYSTORE_BASE64 == ''
      uses: actions/upload-artifact@v4
      with:
        name: realms-of-aetheria-unsigned-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>Realms of Aetheria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #c9a84c;
            font-family: 'Georgia', serif;
            transition: opacity 0.8s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/backgrounds/1.png') center/cover no-repeat;
            opacity: 0.3;
            z-index: -1;
        }
        #loading-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        #loading h1 {
            font-size: 3em;
            margin-bottom: 5px;
            text-shadow: 0 0 30px #c9a84c, 0 0 60px #c9a84c;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px #c9a84c; }
            to { text-shadow: 0 0 40px #ffd700, 0 0 80px #ffd700; }
        }
        #loading .subtitle {
            font-size: 1.1em;
            opacity: 0.8;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        #loading-bar-container {
            width: 400px;
            height: 12px;
            background: rgba(26, 26, 46, 0.8);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid rgba(201, 168, 76, 0.3);
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.2);
        }
        #loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #c9a84c, #ffd700, #c9a84c);
            width: 0%;
            transition: width 0.3s;
            border-radius: 4px;
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        #loading-percent {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #loading-status {
            font-size: 0.9em;
            opacity: 0.6;
        }
        #loading-tips {
            margin-top: 30px;
            font-size: 0.8em;
            opacity: 0.4;
            font-style: italic;
        }
        /* Landscape hint for portrait mode */
        #rotate-hint {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #c9a84c;
            font-family: 'Georgia', serif;
            text-align: center;
        }
        #rotate-hint .icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: rotate-phone 2s ease-in-out infinite;
        }
        @keyframes rotate-phone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        @media (orientation: portrait) {
            #rotate-hint {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="rotate-hint">
        <div class="icon">📱</div>
        <h2>Rotate Your Device</h2>
        <p>This game is designed for landscape mode</p>
    </div>
    <div id="loading">
        <div id="loading-bg"></div>
        <div id="loading-content">
            <h1>Realms of Aetheria</h1>
            <p class="subtitle">A MOBILE RPG ADVENTURE</p>
            <div id="loading-bar-container">
                <div id="loading-bar-fill"></div>
            </div>
            <div id="loading-percent">0%</div>
            <div id="loading-status">Initializing...</div>
            <div id="loading-tips">Tip: Explore all 9 zones to find legendary loot!</div>
        </div>
    </div>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
    <script>
        // Update loading bar from Phaser progress
        window.updateLoading = function(percent, status) {
            const fill = document.getElementById('loading-bar-fill');
            const percentText = document.getElementById('loading-percent');
            const statusText = document.getElementById('loading-status');
            if (fill) fill.style.width = percent + '%';
            if (percentText) percentText.textContent = percent + '%';
            if (statusText && status) statusText.textContent = status;
        };

        // Hide loading screen when game is ready
        window.hideLoading = function() {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.classList.add('hidden');
                setTimeout(() => loading.style.display = 'none', 800);
            }
        };

        // Auto-hide after 20 seconds fallback
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading && loading.style.display !== 'none') {
                window.hideLoading();
            }
        }, 20000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>Realms of Aetheria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #c9a84c;
            font-family: 'Georgia', serif;
            transition: opacity 0.5s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #c9a84c;
        }
        #loading .subtitle {
            font-size: 1em;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        #loading-bar-container {
            width: 300px;
            height: 8px;
            background: #1a1a3e;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #c9a84c, #ffd700);
            width: 0%;
            transition: width 0.2s;
            border-radius: 4px;
        }
        #loading-percent {
            font-size: 1.2em;
            font-weight: bold;
        }
        #loading-status {
            font-size: 0.8em;
            opacity: 0.5;
            margin-top: 5px;
        }
        /* Landscape hint for portrait mode */
        #rotate-hint {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #c9a84c;
            font-family: 'Georgia', serif;
            text-align: center;
        }
        #rotate-hint .icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: rotate-phone 2s ease-in-out infinite;
        }
        @keyframes rotate-phone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        @media (orientation: portrait) {
            #rotate-hint {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div id="rotate-hint">
        <div class="icon">📱</div>
        <h2>Rotate Your Device</h2>
        <p>This game is designed for landscape mode</p>
    </div>
    <div id="loading">
        <h1>Realms of Aetheria</h1>
        <p class="subtitle">A Mobile RPG Adventure</p>
        <div id="loading-bar-container">
            <div id="loading-bar-fill"></div>
        </div>
        <div id="loading-percent">0%</div>
        <div id="loading-status">Initializing...</div>
    </div>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
    <script>
        // Update loading bar from Phaser progress
        window.updateLoading = function(percent, status) {
            const fill = document.getElementById('loading-bar-fill');
            const percentText = document.getElementById('loading-percent');
            const statusText = document.getElementById('loading-status');
            if (fill) fill.style.width = percent + '%';
            if (percentText) percentText.textContent = percent + '%';
            if (statusText && status) statusText.textContent = status;
        };

        // Hide loading screen when game is ready
        window.hideLoading = function() {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.classList.add('hidden');
                setTimeout(() => loading.style.display = 'none', 500);
            }
        };

        // Auto-hide after 30 seconds fallback
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading && loading.style.display !== 'none') {
                window.hideLoading();
            }
        }, 30000);
    </script>
</body>
</html>

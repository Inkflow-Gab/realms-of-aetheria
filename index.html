<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <meta name="theme-color" content="#0a0a1a">
    <title>Realms of Aetheria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #0a0a1a;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: block;
            background: #0a0a1a;
        }
        #game-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* ==========================================
           LOADING SCREEN
           ========================================== */
        #loading {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #c9a84c;
            font-family: 'Georgia', serif;
            overflow: hidden;
            transition: opacity 0.8s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* --- Backdrop: real game art, slowly drifting --- */
        #loading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/backgrounds/1.png') center/cover no-repeat;
            z-index: 0;
            animation: bg-drift 26s ease-in-out infinite alternate;
        }
        @keyframes bg-drift {
            from { transform: scale(1.06) translate(-1.2%, 1%); }
            to   { transform: scale(1.16) translate(1.2%, -1%); }
        }
        /* Vignette + grade so text stays legible over the art */
        #loading-grade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background:
                radial-gradient(ellipse at 50% 42%, rgba(10,10,26,0.25) 0%, rgba(10,10,26,0.88) 78%),
                linear-gradient(180deg, rgba(10,10,26,0.55) 0%, rgba(10,10,26,0.15) 38%, rgba(10,10,26,0.15) 62%, rgba(10,10,26,0.72) 100%);
        }

        /* Drifting motes so the screen is never visually static */
        #motes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .mote {
            position: absolute;
            border-radius: 50%;
            background: #c9a84c;
            opacity: 0;
            animation: mote-rise linear infinite;
        }
        @keyframes mote-rise {
            0%   { opacity: 0;    transform: translateY(0) scale(0.6); }
            12%  { opacity: 0.8; }
            85%  { opacity: 0.3; }
            100% { opacity: 0;    transform: translateY(-340px) scale(1.15); }
        }

        #loading-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Progress ring: the hero element --- */
        #ring-wrap {
            position: relative;
            width: 148px;
            height: 148px;
            margin-bottom: 22px;
        }
        #ring-wrap svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            display: block;
        }
        #ring-wrap .ring-track {
            fill: none;
            stroke: rgba(201, 168, 76, 0.14);
            stroke-width: 5;
        }
        #ring-wrap .ring-fill {
            fill: none;
            stroke: url(#ring-grad);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 326.7;
            stroke-dashoffset: 326.7;
            transition: stroke-dashoffset 0.3s ease-out;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.55));
        }
        /* Rune ticks around the ring, rotating slowly */
        #ring-wrap .ring-runes {
            fill: none;
            stroke: rgba(240, 230, 211, 0.22);
            stroke-width: 1.5;
            stroke-dasharray: 3 9;
            animation: spin 14s linear infinite;
            transform-origin: 60px 60px;
        }
        #ring-pct {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.55em;
            font-weight: bold;
            color: #f0e6d3;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 14px rgba(201, 168, 76, 0.7), 0 2px 3px #000;
        }
        #ring-pct::after {
            content: '%';
            font-size: 0.62em;
            margin-left: 1px;
            opacity: 0.7;
        }

        /* --- Title --- */
        #loading h1 {
            font-size: 2.7em;
            letter-spacing: 3px;
            margin-bottom: 4px;
            color: #f0e6d3;
            position: relative;
            animation: title-glow 2.4s ease-in-out infinite alternate;
        }
        @keyframes title-glow {
            from { text-shadow: 0 0 10px rgba(201, 168, 76, 0.45), 0 2px 4px #000; }
            to   { text-shadow: 0 0 28px rgba(255, 215, 0, 0.85), 0 0 56px rgba(201, 168, 76, 0.55), 0 2px 4px #000; }
        }
        /* A light sweep across the title, like a shine on metal */
        #loading h1::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            transform: translateX(-120%) skewX(-18deg);
            animation: title-sweep 3.4s ease-in-out infinite;
        }
        @keyframes title-sweep {
            0%, 55%  { transform: translateX(-120%) skewX(-18deg); }
            85%, 100%{ transform: translateX(320%)  skewX(-18deg); }
        }

        #loading .subtitle {
            font-size: 0.92em;
            letter-spacing: 4px;
            opacity: 0.7;
            margin-bottom: 24px;
            animation: fade-breathe 3.2s ease-in-out infinite;
        }
        @keyframes fade-breathe {
            0%, 100% { opacity: 0.45; }
            50%      { opacity: 0.85; }
        }

        /* --- Slim progress bar under the ring --- */
        #loading-bar-container {
            position: relative;
            width: min(420px, 74vw);
            height: 8px;
            background: rgba(10, 10, 26, 0.8);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid rgba(201, 168, 76, 0.3);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.7);
        }
        #loading-bar-sheen {
            position: absolute;
            top: 0;
            left: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.4), transparent);
            animation: sheen 1.5s ease-in-out infinite;
        }
        @keyframes sheen {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(340%); }
        }
        #loading-bar-fill {
            position: relative;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8a6d2f, #c9a84c, #ffd700);
            background-size: 200% 100%;
            border-radius: 5px;
            transition: width 0.25s ease-out;
            animation: shimmer 1.7s linear infinite;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* --- Readouts --- */
        #loading-status {
            font-size: 0.85em;
            opacity: 0.8;
            max-width: min(420px, 74vw);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-height: 1.2em;
        }
        #loading-count {
            font-size: 0.7em;
            opacity: 0.42;
            letter-spacing: 1.5px;
            margin-top: 3px;
            font-variant-numeric: tabular-nums;
        }

        /* --- Rotating tips --- */
        #loading-tips {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.8em;
            opacity: 0.55;
            font-style: italic;
            padding: 0 24px;
            z-index: 2;
        }
        #loading-tip-text {
            display: inline-block;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }
        #loading-tip-text.fading {
            opacity: 0;
            transform: translateY(8px);
        }

        /* --- Diagnostics line ---
           Reports exactly what the loader resolved, so a device-side problem
           is visible in a screenshot instead of only in logcat. */
        #loading-diag {
            margin-top: 8px;
            min-height: 1em;
            font-size: 0.66em;
            letter-spacing: 0.04em;
            color: #6f8fa8;
            opacity: 0.85;
            max-width: min(520px, 86vw);
        }

        /* --- Error box --- */
        #loading-error {
            display: none;
            margin-top: 14px;
            padding: 12px 18px;
            max-width: min(540px, 86vw);
            border: 1px solid rgba(231, 76, 60, 0.5);
            border-radius: 8px;
            background: rgba(231, 76, 60, 0.12);
            color: #ffb3ac;
            font-size: 0.76em;
            line-height: 1.5;
            text-align: left;
        }

        /* --- Landscape hint for portrait mode --- */
        #rotate-hint {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #c9a84c;
            font-family: 'Georgia', serif;
            text-align: center;
        }
        #rotate-hint .icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: rotate-phone 2s ease-in-out infinite;
        }
        @keyframes rotate-phone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        @media (orientation: portrait) {
            #rotate-hint { display: flex; }
        }
        /* Short landscape screens: keep the ring and title from colliding */
        @media (max-height: 460px) and (orientation: landscape) {
            #ring-wrap { width: 104px; height: 104px; margin-bottom: 12px; }
            #loading h1 { font-size: 1.9em; }
            #loading .subtitle { margin-bottom: 12px; }
            #loading-tips { bottom: 10px; }
        }
    </style>
</head>
<body>
    <div id="rotate-hint">
        <div class="icon">📱</div>
        <h2>Rotate Your Device</h2>
        <p>This game is designed for landscape mode</p>
    </div>

    <div id="loading">
        <div id="loading-bg"></div>
        <div id="loading-grade"></div>
        <div id="motes"></div>

        <div id="loading-content">
            <!-- Progress ring: percentage sits in the middle, progress is the
                 arc. Far more game-like than a bare bar. -->
            <div id="ring-wrap">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                    <defs>
                        <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%"  stop-color="#8a6d2f"/>
                            <stop offset="55%" stop-color="#c9a84c"/>
                            <stop offset="100%" stop-color="#ffd700"/>
                        </linearGradient>
                    </defs>
                    <circle class="ring-runes" cx="60" cy="60" r="57"/>
                    <circle class="ring-track" cx="60" cy="60" r="52"/>
                    <circle class="ring-fill"  cx="60" cy="60" r="52"/>
                </svg>
                <div id="ring-pct">0%</div>
            </div>

            <h1>Realms of Aetheria</h1>
            <p class="subtitle">A MOBILE RPG ADVENTURE</p>

            <div id="loading-bar-container">
                <div id="loading-bar-sheen"></div>
                <div id="loading-bar-fill"></div>
            </div>

            <div id="loading-status">Starting up...</div>
            <div id="loading-count"></div>
            <div id="loading-diag"></div>

            <div id="loading-error"></div>
        </div>

        <div id="loading-tips">
            <span id="loading-tip-text">Tip: Explore all 9 zones to find legendary loot!</span>
        </div>
    </div>

    <div id="game-container"></div>

    <!--
        Phaser is bundled with the app, not fetched from a CDN.

        The APK ships every byte it needs, so the game has to start on a plane,
        on first launch, and with no data connection. A CDN <script> tag made
        the whole game depend on DNS, TLS and the user's network, and a blocked
        or throttled request left the app on the loading screen forever.
    -->
    <script src="vendor/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>

    <script>
    (function () {
        'use strict';

        var el = {
            root:     document.getElementById('loading'),
            fill:     document.getElementById('loading-bar-fill'),
            status:   document.getElementById('loading-status'),
            count:    document.getElementById('loading-count'),
            diag:     document.getElementById('loading-diag'),
            error:    document.getElementById('loading-error'),
            tip:      document.getElementById('loading-tip-text'),
            motes:    document.getElementById('motes'),
            ringFill: document.querySelector('.ring-fill'),
            ringPct:  document.getElementById('ring-pct')
        };

        // Circumference of the progress ring (r=52 in a 120x120 viewBox).
        var RING_LEN = 2 * Math.PI * 52;

        /**
         * Push one percentage to every progress element at once.
         *
         * The ring and the bar are driven together so they can never disagree,
         * and the percentage text lives inside the ring where it is actually
         * readable rather than off to one side.
         */
        function applyProgress(pct) {
            pct = Math.max(0, Math.min(100, pct || 0));

            if (el.fill) el.fill.style.width = pct + '%';
            if (el.ringFill) {
                el.ringFill.style.strokeDashoffset = String(RING_LEN * (1 - pct / 100));
            }
            if (el.ringPct) el.ringPct.textContent = Math.floor(pct);
        }

        var hidden = false;
        var lastPct = 0;

        // ---------------------------------------------------------
        // Backdrop art
        // ---------------------------------------------------------
        // The loading screen uses the inline copy of the main background, so
        // the art is on screen from the very first paint -- before Phaser has
        // booted and even if the device refuses every network request. The
        // module that publishes this runs after this inline script, so it is
        // applied as soon as it appears rather than assumed to be ready.
        (function applyBackdrop() {
            var url = window.EMBEDDED_IMAGES && window.EMBEDDED_IMAGES.bg_1;
            var bg = document.getElementById('loading-bg');
            if (url && bg) {
                bg.style.backgroundImage = "url('" + url + "')";
                return;
            }
            setTimeout(applyBackdrop, 60);
        })();

        // ---------------------------------------------------------
        // Ambient motes
        // ---------------------------------------------------------
        (function spawnMotes() {
            if (!el.motes) return;
            for (var i = 0; i < 18; i++) {
                var m = document.createElement('div');
                m.className = 'mote';
                m.style.left = (Math.random() * 100) + '%';
                m.style.bottom = (-10 - Math.random() * 30) + '%';
                m.style.animationDuration = (5 + Math.random() * 6) + 's';
                m.style.animationDelay = (Math.random() * 6) + 's';
                var s = 1.5 + Math.random() * 2.5;
                m.style.width = s + 'px';
                m.style.height = s + 'px';
                el.motes.appendChild(m);
            }
        })();

        // ---------------------------------------------------------
        // Rotating tips
        // ---------------------------------------------------------
        var TIPS = [
            'Tip: Explore all 9 zones to find legendary loot!',
            'Tip: Level up your HP and DEF before taking on a boss.',
            'Tip: Potions can be bought in bulk from any town shop.',
            'Tip: Different weapon types suit different classes.',
            'Tip: Defeating monsters in a group earns bonus gold.',
            'Tip: Your progress saves automatically between zones.'
        ];

        (function rotateTips() {
            if (!el.tip) return;
            setInterval(function () {
                el.tip.classList.add('fading');
                setTimeout(function () {
                    el.tip.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
                    el.tip.classList.remove('fading');
                }, 450);
            }, 4200);
        })();

        // ---------------------------------------------------------
        // Progress reporting (called from Phaser)
        // ---------------------------------------------------------
        /**
         * @param {number} percent   0-100
         * @param {string} status    human readable status line
         * @param {object} [extra]   { loaded, total, bytes }
         */
        window.updateLoading = function (percent, status, extra) {
            if (hidden || !el.fill) return;

            // Never let the bar visibly jump backwards.
            var pct = Math.max(lastPct, Math.max(0, Math.min(100, percent || 0)));
            lastPct = pct;

            applyProgress(pct);
            if (status) el.status.textContent = status;

            if (extra && typeof extra.total === 'number' && extra.total > 0) {
                el.count.textContent =
                    extra.loaded + ' / ' + extra.total + ' assets' +
                    (extra.bytes ? '  ·  ' + extra.bytes : '');
            }
        };

        /** Jump straight to a state with no progress animation. */
        window.setLoadingMessage = function (percent, status) {
            if (hidden || !el.fill) return;
            lastPct = percent;
            applyProgress(percent);
            if (status) el.status.textContent = status;
        };

        /** Surface a fatal load failure instead of hanging on a fake 0%. */
        window.showLoadingError = function (message) {
            if (!el.error) return;
            el.error.style.display = 'block';
            el.error.textContent = message;
            if (el.status) el.status.textContent = 'Failed to load';
        };

        /**
         * Record what the loader actually resolved.
         *
         * Kept on screen deliberately: if a build misbehaves on a real device
         * this is the one line that distinguishes "assets 404" from "requests
         * never returned" from "decoded but rejected", none of which are
         * visible in the progress bar on their own.
         */
        window.reportDiag = function (message) {
            if (!el.diag) return;
            el.diag.textContent = message;
        };

        /** Fade the loader out. Safe to call more than once. */
        window.hideLoading = function () {
            if (hidden || !el.root) return;
            hidden = true;
            el.root.classList.add('hidden');
            setTimeout(function () {
                if (el.root) el.root.style.display = 'none';
            }, 750);
        };

        // Watchdog.
        //
        // Tracks real movement rather than `lastPct === 0`: the preload scene
        // sets 1-2% the moment it starts, so the old check could never fire
        // and the screen sat on a dead "0 / 31" no matter how long it hung.
        // Now any stall is both reported on screen and logged.
        var lastMove = Date.now();
        var origUpdate = window.updateLoading;
        window.updateLoading = function (percent, status, extra) {
            if (percent > lastPct || (extra && extra.loaded > 0)) {
                lastMove = Date.now();
            }
            return origUpdate(percent, status, extra);
        };

        var watchdog = setInterval(function () {
            if (hidden) { clearInterval(watchdog); return; }
            var idle = Date.now() - lastMove;
            if (idle < 6000) return;

            // Assets finished but the overlay was never dismissed (the bug that
            // produced "Failed to load" at 37/37 on device). Force the handoff.
            if (lastPct >= 99) {
                window.reportDiag('ready -- opening menu...');
                window.hideLoading();
                clearInterval(watchdog);
                return;
            }

            if (idle > 20000) {
                window.showLoadingError(
                    'Assets are not responding. The game will keep trying -- ' +
                    'if this persists, reinstall the app so its data is rebuilt.'
                );
                window.reportDiag('stalled ' + Math.round(idle / 1000) + 's');
            } else if (!el.diag || !el.diag.textContent) {
                window.reportDiag('waiting on assets... ' + Math.round(idle / 1000) + 's');
            }
        }, 2000);
    })();
    </script>
</body>
</html>
